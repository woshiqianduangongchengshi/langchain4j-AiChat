## streaming(using Ollama local deepseek-r1:8b  or llama3.1:8b)
langchain4j.ollama.streaming-chat-model.base-url=http://localhost:11434
langchain4j.ollama.streaming-chat-model.model-name=deepseek-r1:8b
langchain4j.ollama.streaming-chat-model.log-requests=true
langchain4j.ollama.streaming-chat-model.log-responses=true
#
## embed(using Ollama local nomic-embed-text:v1.5)
langchain4j.ollama.embedding-model.base-url=http://localhost:11434
langchain4j.ollama.embedding-model.model-name=nomic-embed-text:v1.5
langchain4j.ollama.embedding-model.log-requests=true
langchain4j.ollama.embedding-model.log-responses=true
# debug information
logging.level.dev.langchain4j=DEBUG
logging.level.org.example.langchain=DEBUG

#path
server.servlet.context-path=/api
spring.jpa.open-in-view=false

# JWTconfig
jwt.secret=my-super-secret-jwt-key-that-is-at-least-32-characters-long
jwt.expiration=86400000
